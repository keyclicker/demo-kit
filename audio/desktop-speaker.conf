# desktop-speaker: :0's default audio output, a virtual sink.
# Sound stays inside the machine; deskaudio streams its monitor to the
# /desktops page. Physical outputs (built-in, Bluetooth) still work
# when picked on purpose. Install: see ../AGENTS.md, audio.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = desktop-speaker
      node.description = "Desktop speaker (browser stream)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      # Above ALSA (~1009) and Bluetooth (~1010): wins the fallback
      priority.session = 2000
      priority.driver  = 2000
      monitor.channel-volumes = true
    }
  }
]
