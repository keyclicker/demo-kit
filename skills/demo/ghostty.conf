# Ghostty for demo recordings on desk displays: its own process (never
# a window of the user's Ghostty on :0), not the user's config (wide
# prompt, low-contrast theme), xfwm4's plain title bar, no tmux. Its
# zsh is zsh/.zshrc beside this file:
#
#   S=$HOME/projects/demo-kit/skills/demo
#   DISPLAY=$D ZDOTDIR=$S/zsh setsid -f ghostty \
#     --config-default-files=false --config-file=$S/ghostty.conf

gtk-single-instance = false
window-decoration = server
gtk-titlebar = false
title = Ghostty
confirm-close-surface = false

env = TMUX_AUTOATTACH=0

# High contrast survives video compression; matches the code scenes
theme = GitHub Dark Default
font-size = 14
cursor-style-blink = false
