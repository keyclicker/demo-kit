# Ghostty for agents' desk displays: its own process (never a window
# of the user's Ghostty on :0), none of their config, no tmux, and
# xfwm4's plain title bar instead of GTK's header bar.
#
#   DISPLAY=$D setsid -f ghostty --config-default-files=false \
#     --config-file=$HOME/projects/demo-kit/skills/demo/ghostty.conf -e CMD

gtk-single-instance = false
window-decoration = server
gtk-titlebar = false
title = Ghostty
confirm-close-surface = false

env = TMUX_AUTOATTACH=0

font-size = 14
background = 0d1117
foreground = e6edf3
cursor-style-blink = false
