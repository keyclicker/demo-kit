# A virtual speaker for a headless machine: the default output goes
# nowhere audible, and deskview streams it to the page's 🔊 (set
# deskview.audio_sink and demo.sink to "desktop-speaker"). Physical
# outputs still work when picked on purpose.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/, then
# systemctl --user restart pipewire
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = desktop-speaker
      node.description = "Desktop speaker (browser stream)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      # Above ALSA (~1009) and Bluetooth (~1010): wins the fallback
      priority.session = 2000
      priority.driver  = 2000
      monitor.channel-volumes = true
    }
  }
]
