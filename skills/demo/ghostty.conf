# Ghostty for agents' desk displays, over the user's own config (font,
# theme, their zsh): its own process (never a window of the user's
# Ghostty on :0), no tmux, xfwm4's plain title bar instead of GTK's
# header bar, opaque (desk runs no compositor), video-sized text.
#
#   DISPLAY=$D setsid -f ghostty \
#     --config-file=$HOME/projects/demo-kit/skills/demo/ghostty.conf

gtk-single-instance = false
window-decoration = server
gtk-titlebar = false
gtk-titlebar-style = native
gtk-tabs-location = hidden
title = Ghostty
confirm-close-surface = false

env = TMUX_AUTOATTACH=0

font-size = 14
background-opacity = 1
cursor-style-blink = false
