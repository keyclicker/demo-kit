<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>desktops · demo-kit</title>
    <script>
      // Under a path prefix, a proxy may serve this page at /prefix too:
      // relative URLs then resolve against the root. Add the slash first
      if (!location.pathname.endsWith("/")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <style>
      /* Always dark: it frames desktops, not a page. */
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e5e5e5;
        background: #1a1a1a;
        font-size: 13px;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      nav {
        display: flex;
        gap: 4px;
        padding: 2px 8px;
        background: #242424;
        border-bottom: 1px solid #333333;
      }

      nav a {
        padding: 2px 12px;
        color: #999999;
        font-weight: 500;
        text-decoration: none;
        border-radius: 6px;
      }

      nav a[aria-current] {
        color: #ffffff;
        background: #3a3a3a;
      }

      nav .end {
        margin-left: auto;
      }

      nav button {
        padding: 2px 12px;
        color: #999999;
        font: inherit;
        font-weight: 500;
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      nav button:disabled {
        color: #555555;
        cursor: default;
      }

      nav button[aria-pressed="true"] {
        color: #ffffff;
        background: #3a3a3a;
      }

      /* One per desktop; RFB draws its canvas inside, scaled to fit */
      .screen {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .screen[hidden] {
        display: none;
      }

      /* Not connected (yet): say so over the last picture */
      .screen[data-status]::after {
        content: attr(data-status);
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        color: #999999;
        background: #242424;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <!-- One live VNC screen per desktop (noVNC's RFB client), listed by
         deskview's api/desktops (`desk ls --json`) and re-polled, so
         agent desktops come and go as tabs. Tabs only toggle which one
         shows, so switching never reconnects. The host display opens
         interactive; desk's agent desktops are view-only (their Xvnc
         ignores VNC input too). Every URL is relative: deskview may sit
         under a path prefix. -->
    <nav>
      <button class="end" id="control" aria-pressed="false">🖱 control</button>
      <button id="sound" aria-pressed="false" disabled
              title="checking for sound…">🔇 sound</button>
    </nav>

    <script type="module">
      import RFB from "./novnc/core/rfb.js";

      const nav = document.querySelector("nav");
      // token → { token, display, tab, screen, rfb, retry, stopped,
      // viewOnly, control }, in display order
      const desks = new Map();

      // ---- connections ------------------------------------------------

      // ws(s)://…/vnc/N, against the page: deskview may sit under a prefix
      function vncURL(token) {
        const url = new URL(`vnc/${token}`, location.href);
        url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return url.href;
      }

      // Connect an entry's screen; dropped, try again in 2 s while it's
      // still listed. An RFB is one connection: each try is a new one.
      function connect(entry) {
        const rfb = new RFB(entry.screen, vncURL(entry.token), {
          wsProtocols: ["binary"],
        });
        rfb.scaleViewport = true;
        rfb.background = "#1a1a1a";
        rfb.viewOnly = !entry.control;
        entry.rfb = rfb;

        rfb.addEventListener("connect", () => {
          delete entry.screen.dataset.status;
        });

        rfb.addEventListener("disconnect", () => {
          entry.rfb = null;
          if (desks.get(entry.token) !== entry || entry.stopped) return;
          entry.screen.dataset.status = "reconnecting…";
          entry.retry = setTimeout(() => connect(entry), 2000);
        });

        // A host VNC may have a password; desk's own never do. Cancel
        // stops trying until the page reloads.
        rfb.addEventListener("credentialsrequired", () => {
          const password = prompt(`VNC password for ${entry.display}:`);
          if (password !== null) return rfb.sendCredentials({ password });

          entry.stopped = true;
          entry.screen.dataset.status = "no password";
          rfb.disconnect();
        });

        rfb.addEventListener("bell", bell);
      }

      // ---- tabs -------------------------------------------------------

      // Add a tab and a live screen for a new desktop.
      function add(desk) {
        const tab = document.createElement("a");
        tab.href = "#" + desk.token;
        tab.textContent = desk.viewOnly
          ? `Agent · ${desk.display}`
          : `Host · ${desk.display}`;

        const screen = document.createElement("div");
        screen.className = "screen";
        screen.title = `Desktop ${desk.display}`;
        screen.dataset.status = "connecting…";
        screen.hidden = true;

        // Keep tabs sorted by display number
        const next = [...desks.keys()].find((t) => Number(t) > Number(desk.token));
        nav.insertBefore(tab, next ? desks.get(next).tab : controlButton);
        document.body.append(screen);

        // The host display takes input by default; agent desktops ignore it
        const entry = {
          token: desk.token, display: desk.display, tab, screen,
          rfb: null, retry: null, stopped: false,
          viewOnly: desk.viewOnly, control: !desk.viewOnly,
        };
        desks.set(desk.token, entry);
        connect(entry);
      }

      // Drop a desktop that's gone: its tab, screen and connection.
      function remove(token) {
        const entry = desks.get(token);
        desks.delete(token); // first: its disconnect then won't retry

        clearTimeout(entry.retry);
        entry.rfb?.disconnect();
        entry.tab.remove();
        entry.screen.remove();
      }

      // Owner on hover: an agent desktop's creator, or the agent that
      // claimed the host display.
      function tabTitle(desk) {
        const who = desk.owner ? `${desk.owner.name} ${desk.owner.pid}` : null;
        if (desk.viewOnly) return `view-only · owner: ${who ?? "unknown"}`;
        return who ? `claimed by ${who}` : "";
      }

      // Match tabs to the desktop list; true if anything changed. Only
      // displays with a VNC address can be shown.
      function sync(all) {
        const list = all.filter((d) => d.vnc);
        const live = new Set(list.map((d) => d.token));
        let changed = false;

        for (const token of [...desks.keys()]) {
          if (!live.has(token)) {
            remove(token);
            changed = true;
          }
        }

        for (const desk of list) {
          if (!desks.has(desk.token)) {
            add(desk);
            changed = true;
          }
          desks.get(desk.token).tab.title = tabTitle(desk);
        }

        // Map order follows insertion; re-sort for the fallback tab
        const sorted = [...desks].sort(([a], [b]) => a - b);
        desks.clear();
        for (const [token, entry] of sorted) desks.set(token, entry);

        return changed;
      }

      // Show the desktop named by the hash, else the first one.
      function show() {
        if (desks.size === 0) return;

        const wanted = location.hash.slice(1);
        const name = desks.has(wanted) ? wanted : desks.keys().next().value;

        for (const [token, { tab, screen }] of desks) {
          screen.hidden = token !== name;
          if (token === name) {
            current = token;
            tab.setAttribute("aria-current", "true");
          } else {
            tab.removeAttribute("aria-current");
          }
        }
        desks.get(name).rfb?.focus();
        renderControl();
      }

      // ---- control (view-only) toggle ---------------------------------
      // RFB's viewOnly, live: no reconnect. Agent desktops' Xvnc ignores
      // VNC input (-Accept*=0), so their toggle stays off.

      const controlButton = document.getElementById("control");
      let current = null; // token of the shown desktop

      function renderControl() {
        const entry = desks.get(current);
        if (!entry) return;

        controlButton.disabled = entry.viewOnly;
        controlButton.title = entry.viewOnly
          ? "agent desktop: its VNC ignores input"
          : "send mouse and keyboard to this desktop";
        controlButton.setAttribute("aria-pressed", String(entry.control));
        controlButton.textContent = entry.control ? "🖱 control" : "👁 view only";
      }

      controlButton.addEventListener("click", () => {
        const entry = desks.get(current);
        entry.control = !entry.control;
        if (entry.rfb) {
          entry.rfb.viewOnly = !entry.control;
          entry.rfb.focus();
        }
        renderControl();
      });

      async function poll() {
        try {
          const res = await fetch("api/desktops", { cache: "no-store" });
          if (res.ok && sync(await res.json())) show();
        } catch {
          // deskview unreachable: keep the tabs we have
        }
      }

      // ---- sound ----------------------------------------------------
      // VNC has no audio. deskview streams a PipeWire sink
      // as raw s16le PCM; a worklet plays it, holding ~80 ms of buffer.

      const worklet = `
        class Pcm extends AudioWorkletProcessor {
          constructor() {
            super();
            this.queue = [];   // interleaved stereo Float32Arrays
            this.offset = 0;   // frames consumed of queue[0]
            this.frames = 0;   // frames buffered
            this.playing = false;
            this.port.onmessage = (e) => this.push(e.data);
          }

          // Queue a chunk; past 250 ms of lag, skip back to 80 ms.
          push(chunk) {
            this.queue.push(chunk);
            this.frames += chunk.length / 2;
            if (this.frames < sampleRate * 0.25) return;

            while (this.frames > sampleRate * 0.08 && this.queue.length > 1) {
              this.frames -= this.queue.shift().length / 2 - this.offset;
              this.offset = 0;
            }
          }

          process(_, [[left, right]]) {
            // After an underrun, wait for 40 ms so playback doesn't crackle
            if (!this.playing && this.frames >= sampleRate * 0.04) this.playing = true;

            for (let i = 0; i < left.length; i++) {
              if (!this.playing || this.frames === 0) {
                left[i] = right[i] = 0;
                this.playing = false;
                continue;
              }

              const chunk = this.queue[0];
              left[i] = chunk[this.offset * 2];
              right[i] = chunk[this.offset * 2 + 1];
              this.frames--;

              if (++this.offset * 2 >= chunk.length) {
                this.queue.shift();
                this.offset = 0;
              }
            }
            return true;
          }
        }
        registerProcessor("pcm", Pcm);
      `;

      const soundButton = document.getElementById("sound");
      let sound = null; // { ctx, abort } while on

      // Pipe the stream into the worklet until aborted; reconnect on drops.
      async function pump(node, signal) {
        while (!signal.aborted) {
          try {
            const res = await fetch("audio/stream", { signal, cache: "no-store" });
            const reader = res.body.getReader();
            let rest = new Uint8Array(0); // bytes of a split sample

            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;

              const bytes = new Uint8Array(rest.length + value.length);
              bytes.set(rest);
              bytes.set(value, rest.length);

              const whole = bytes.length - (bytes.length % 4); // full frames
              rest = bytes.slice(whole);

              const pcm = new Int16Array(bytes.buffer, 0, whole / 2);
              const out = new Float32Array(pcm.length);
              for (let i = 0; i < pcm.length; i++) out[i] = pcm[i] / 32768;
              node.port.postMessage(out, [out.buffer]);
            }
          } catch {
            // aborted, or deskview unreachable: retry below
          }
          if (!signal.aborted) await new Promise((r) => setTimeout(r, 1000));
        }
      }

      async function startSound() {
        const ctx = new AudioContext({ sampleRate: 48000, latencyHint: "interactive" });
        const url = URL.createObjectURL(new Blob([worklet], { type: "text/javascript" }));
        await ctx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);

        const node = new AudioWorkletNode(ctx, "pcm", { outputChannelCount: [2] });
        node.connect(ctx.destination);

        const abort = new AbortController();
        sound = { ctx, abort };
        pump(node, abort.signal);
      }

      function stopSound() {
        sound.abort.abort();
        sound.ctx.close();
        sound = null;
      }

      // An X bell: a short beep, only while 🔊 is on, like the rest of
      // the page's sound.
      function bell() {
        if (!sound) return;

        const { ctx } = sound;
        const tone = new OscillatorNode(ctx, { frequency: 880 });
        const gain = new GainNode(ctx, { gain: 0.15 });
        tone.connect(gain).connect(ctx.destination);
        tone.start();
        tone.stop(ctx.currentTime + 0.12);
      }

      // Browsers only start audio from a click, so sound is never on at load
      soundButton.addEventListener("click", async () => {
        if (sound) stopSound();
        else await startSound();

        soundButton.setAttribute("aria-pressed", String(!!sound));
        soundButton.textContent = sound ? "🔊 sound" : "🔇 sound";
      });

      addEventListener("hashchange", show);

      // No PipeWire (or audio off): the button stays, disabled, saying why
      async function checkSound() {
        try {
          const res = await fetch("api/audio", { cache: "no-store" });
          const audio = await res.json();
          soundButton.disabled = !audio.available;
          soundButton.title = audio.available
            ? "the session's sound, streamed by deskview"
            : `no sound: ${audio.reason}`;
        } catch {
          soundButton.title = "no sound: deskview unreachable";
        }
      }

      checkSound();
      poll();
      setInterval(poll, 3000);
    </script>
  </body>
</html>
